name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check sw.js

      - name: Finance tests
        run: node tests/finance.test.cjs

      - name: Invoice form regression tests
        run: node tests/form-regression.test.cjs

      - name: Security hardening tests
        run: node tests/security.test.cjs

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest: OK')"
