name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality + TypeScript + release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install validation toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Probe live market sources
        run: node scripts/probe-market-sources.cjs

      - name: Syntax check
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check mobile-menu-toggle.js
          node --check v76-veggie-menu.js
          node --check sync.js
          node --check sync-conflict-policy.js
          node --check market-experience.js
          node --check market-branding.js
          node --check market-category-groups.js
          node --check market-shopping-focus.js
          node --check market-barcode.js
          node --check ui-icons.js
          node --check design-asset-library.js
          node --check asset-loader.js
          node --check invoice-capture.js
          node --check app-update.js
          node --check market-image-library.js
          node --check market-retailer-image-policy.js
          node --check market-image-audit.js
          node --check market-official-images.js
          node --check market-catalog-image-resolver.js
          node --check market-visual-catalog.js
          node --check pingo-doce-photo-library.js
          node --check market-photo-loader.js
          node --check v64-runtime.js
          node --check v74-experience.js
          node --check v75-architecture.js
          node --check v75-stability.js
          node --check v75-startup-guard.js
          node --check v75-market-featured.js
          node --check v75-market-flow.js
          node --check sw.js
          node --check scripts/prepare-pages.cjs
          node --check tests/release-readiness.test.cjs
          node --check tests/e2e/release-smoke.spec.cjs
          node --check playwright.config.cjs

      - name: Finance tests
        run: node tests/finance.test.cjs

      - name: Financial audit tests
        run: node tests/audit.test.cjs

      - name: Exact counting invariants
        run: node tests/counting-invariants.test.cjs

      - name: User isolation and clean-vault tests
        run: node tests/isolation.test.cjs

      - name: Civil date timezone tests
        run: node tests/date-timezone.test.cjs

      - name: Invoice form regression tests
        run: node tests/form-regression.test.cjs

      - name: Invoice QR capture tests
        run: node tests/invoice-capture.test.cjs

      - name: Market category tests
        run: node tests/market-categories.test.cjs

      - name: Market grouped-list tests
        run: node tests/market-category-groups.test.cjs

      - name: Market mobile shopping-focus tests
        run: node tests/market-shopping-focus.test.cjs

      - name: Market live-source tests
        run: node tests/market-experience.test.cjs

      - name: Market real product image tests
        run: node tests/market-product-images.test.cjs

      - name: Market image audit and zoom tests
        run: node tests/market-image-audit.test.cjs

      - name: Market browser official-image bridge tests
        run: node tests/market-official-images.test.cjs

      - name: Market persistent image library tests
        run: node tests/market-image-library.test.cjs

      - name: Market progressive visual catalog tests
        run: node tests/market-visual-catalog.test.cjs

      - name: Pingo Doce progressive photo library tests
        run: node tests/pingo-doce-photo-library.test.cjs

      - name: Market photo loader tests
        run: node tests/market-photo-loader.test.cjs

      - name: Market barcode scanner tests
        run: node tests/market-barcode.test.cjs

      - name: Market quantity and accounting tests
        run: node tests/market-live-accounting.test.cjs

      - name: v75 Mercado flow tests
        run: node tests/v75-market-flow.test.cjs

      - name: v64 scanner, billing-cycle and v74 shell tests
        run: node tests/v64-runtime.test.cjs

      - name: Unified icon audit tests
        run: node tests/ui-icons.test.cjs

      - name: Design asset library and loader tests
        run: node tests/design-asset-library.test.cjs

      - name: Visual consistency and v74 base tests
        run: node tests/ui-consistency.test.cjs

      - name: v75 information architecture tests
        run: node tests/v75-architecture.test.cjs

      - name: v75 cross-application stability tests
        run: node tests/v75-stability.test.cjs

      - name: Safari/PWA startup blank-screen regression tests
        run: node tests/safari-startup.test.cjs

      - name: v75 page proportion and alignment tests
        run: node tests/v75-layout-polish.test.cjs

      - name: v75 modern expenses UI tests
        run: node tests/v75-expenses-modern.test.cjs

      - name: v75 featured Mercado prototype tests
        run: node tests/v75-market-featured.test.cjs

      - name: v75 right teal drawer tests
        run: node tests/v75-drawer-theme.test.cjs

      - name: Animated mobile menu tests
        run: node tests/mobile-menu-toggle.test.cjs

      - name: v76 Veggie Burger TypeScript tests
        run: node tests/v76-veggie-menu.test.cjs

      - name: v76 master UI tests
        run: node tests/v76-modern-ui.test.cjs

      - name: v76 mobile shell safe-area tests
        run: node tests/v76-mobile-shell.test.cjs

      - name: UI architecture contract tests
        run: node tests/ui-architecture-contract.test.cjs

      - name: Software update center tests
        run: node tests/app-update.test.cjs

      - name: Release readiness gate
        run: npm run check:release

      - name: Security hardening tests
        run: node tests/security.test.cjs

      - name: Responsive layout tests
        run: node tests/responsive.test.cjs

      - name: Mobile viewport regression tests
        run: node tests/mobile-layout-regression.test.cjs

      - name: Navigation architecture tests
        run: node tests/navigation.test.cjs

      - name: Accessibility foundation tests
        run: node tests/accessibility.test.cjs

      - name: Sync safety tests
        run: node tests/sync.test.cjs

      - name: Sync technical-conflict policy tests
        run: node tests/sync-conflict-policy.test.cjs

      - name: Sync runtime tests
        run: node tests/sync-runtime.test.cjs

      - name: Validate manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('Manifest OK')"
          node -e "const m=JSON.parse(require('fs').readFileSync('release-manifest.json','utf8')); if(m.latestVersion!=='v76') process.exit(1); console.log('Release manifest v76 OK')"

  browser-smoke:
    name: Browser smoke (Chromium + WebKit)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install validation toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Release browser smoke tests
        run: npm run test:e2e

      - name: Preserve Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
