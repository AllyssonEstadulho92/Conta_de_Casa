name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Probe live market sources
        run: node scripts/probe-market-sources.cjs

      - name: Syntax check
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check sync.js
          node --check market-experience.js
          node --check market-barcode.js
          node --check ui-icons.js
          node --check invoice-capture.js
          node --check app-update.js
          node --check market-image-audit.js
          node --check market-official-images.js
          node --check sw.js
          node --check scripts/prepare-pages.cjs

      - name: Finance tests
        run: node tests/finance.test.cjs

      - name: Financial audit tests
        run: node tests/audit.test.cjs

      - name: Exact counting invariants
        run: node tests/counting-invariants.test.cjs

      - name: User isolation and clean-vault tests
        run: node tests/isolation.test.cjs

      - name: Civil date timezone tests
        run: node tests/date-timezone.test.cjs

      - name: Invoice form regression tests
        run: node tests/form-regression.test.cjs

      - name: Invoice QR capture tests
        run: node tests/invoice-capture.test.cjs

      - name: Market category tests
        run: node tests/market-categories.test.cjs

      - name: Market live-source tests
        run: node tests/market-experience.test.cjs

      - name: Market real product image tests
        run: node tests/market-product-images.test.cjs

      - name: Market image audit and zoom tests
        run: node tests/market-image-audit.test.cjs

      - name: Market browser official-image bridge tests
        run: node tests/market-official-images.test.cjs

      - name: Market barcode scanner tests
        run: node tests/market-barcode.test.cjs

      - name: Market quantity and accounting tests
        run: node tests/market-live-accounting.test.cjs

      - name: Unified icon audit tests
        run: node tests/ui-icons.test.cjs

      - name: Software update center tests
        run: node tests/app-update.test.cjs

      - name: Security hardening tests
        run: node tests/security.test.cjs

      - name: Responsive layout tests
        run: node tests/responsive.test.cjs

      - name: Mobile viewport regression tests
        run: node tests/mobile-layout-regression.test.cjs

      - name: Navigation architecture tests
        run: node tests/navigation.test.cjs

      - name: Accessibility foundation tests
        run: node tests/accessibility.test.cjs

      - name: Sync safety tests
        run: node tests/sync.test.cjs

      - name: Sync runtime tests
        run: node tests/sync-runtime.test.cjs

      - name: Validate manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('Manifest OK')"