name: Apply market real images v57

on:
  push:
    branches: [ui/market-real-images-v57]
    paths:
      - scripts/apply-market-real-images-v57.cjs
      - .github/workflows/apply-market-real-images-v57.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/market-real-images-v57
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply audited v57 patch
        run: node scripts/apply-market-real-images-v57.cjs

      - name: Syntax and focused tests
        run: |
          node --check core.js
          node --check render.js
          node --check market-experience.js
          node --check market-barcode.js
          node --check ui-icons.js
          node --check sw.js
          node tests/market-product-images.test.cjs
          node tests/market-experience.test.cjs
          node tests/market-barcode.test.cjs
          node tests/ui-icons.test.cjs
          node tests/security.test.cjs
          node tests/responsive.test.cjs

      - name: Commit v57 revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js render.js market-experience.js market-barcode.js ui-icons.css index.html sw.js tests docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: mostrar fotografias reais na lista de compras"
            git push origin HEAD:ui/market-real-images-v57
          fi
