name: Mobile Assets

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-assets-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  android-verify:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare public web bundle
        run: npm run mobile:prepare

      - name: Isolate verification package id
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='capacitor.config.json';
          const cfg=JSON.parse(fs.readFileSync(path,'utf8'));
          cfg.appId += '.verify';
          cfg.appName += ' Verify';
          fs.writeFileSync(path,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Create Android wrapper
        run: npx cap add android

      - name: Generate Android icons and splash assets
        run: |
          mkdir -p assets
          cp icon.svg assets/logo.svg
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b63e5' --iconBackgroundColorDark '#0b63e5' --splashBackgroundColor '#f7f9fc' --splashBackgroundColorDark '#0d1420'

      - name: Sync Android
        run: npx cap sync android

      - name: Build verification APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage verification APK
        run: |
          mkdir -p mobile-release
          cp android/app/build/outputs/apk/debug/app-debug.apk mobile-release/Conta-de-Casa-Android-verification.apk
          sha256sum mobile-release/Conta-de-Casa-Android-verification.apk > mobile-release/Conta-de-Casa-Android-verification.sha256

      - name: Upload Android verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conta-de-Casa-Android-verification
          path: mobile-release/
          if-no-files-found: error
          retention-days: 7

  ios-verify:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: macos-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install pinned mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare public web bundle
        run: npm run mobile:prepare

      - name: Isolate verification bundle id
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path='capacitor.config.json';
          const cfg=JSON.parse(fs.readFileSync(path,'utf8'));
          cfg.appId += '.verify';
          cfg.appName += ' Verify';
          fs.writeFileSync(path,JSON.stringify(cfg,null,2)+'\n');
          NODE

      - name: Create iOS wrapper
        run: npx cap add ios

      - name: Generate iOS icons and splash assets
        run: |
          mkdir -p assets
          cp icon.svg assets/logo.svg
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0b63e5' --iconBackgroundColorDark '#0b63e5' --splashBackgroundColor '#f7f9fc' --splashBackgroundColorDark '#0d1420'

      - name: Sync iOS
        run: npx cap sync ios

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build iOS simulator app without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS verification project
        uses: actions/upload-artifact@v4
        with:
          name: Conta-de-Casa-iOS-verification-project
          path: |
            ios/
            build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

  android-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check stable signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable Android signing secrets are not configured; no public APK will be released."
          fi

      - name: Setup Node
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Java
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned mobile dependencies
        if: steps.signing.outputs.ready == 'true'
        run: npm install --no-audit --no-fund

      - name: Prepare public web bundle
        if: steps.signing.outputs.ready == 'true'
        run: npm run mobile:prepare

      - name: Create Android production wrapper
        if: steps.signing.outputs.ready == 'true'
        run: npx cap add android

      - name: Generate production Android assets
        if: steps.signing.outputs.ready == 'true'
        run: |
          mkdir -p assets
          cp icon.svg assets/logo.svg
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b63e5' --iconBackgroundColorDark '#0b63e5' --splashBackgroundColor '#f7f9fc' --splashBackgroundColorDark '#0d1420'
          npx cap sync android

      - name: Decode signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/conta-de-casa-release.jks"

      - name: Build unsigned release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and verify release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir -p mobile-release
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/Conta-de-Casa-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/conta-de-casa-release.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass "pass:$STORE_PASSWORD"             --key-pass "pass:$KEY_PASSWORD"             --out mobile-release/Conta-de-Casa-v47-Android.apk             "$RUNNER_TEMP/Conta-de-Casa-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs mobile-release/Conta-de-Casa-v47-Android.apk
          sha256sum mobile-release/Conta-de-Casa-v47-Android.apk > mobile-release/Conta-de-Casa-v47-Android.sha256

      - name: Upload signed Android artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Conta-de-Casa-v47-Android-signed
          path: mobile-release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed APK as GitHub Release asset
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION="v47"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$TARGET_SHA" --title "Conta de Casa $VERSION" --notes "Pacote Android assinado da Conta de Casa. Verifique o ficheiro SHA-256 antes de instalar."
          fi
          gh release upload "$VERSION" mobile-release/Conta-de-Casa-v47-Android.apk mobile-release/Conta-de-Casa-v47-Android.sha256 --clobber
