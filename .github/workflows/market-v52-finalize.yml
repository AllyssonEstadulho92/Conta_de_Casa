name: Finalize Market v52
# Finalization trigger 4

on:
  push:
    branches:
      - feature/market-live-prices-v52
    paths:
      - .github/workflows/market-v52-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/market-live-prices-v52

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply audited v52 finalization
        run: |
          python3 scripts/finalize-market-v52.py
          sed -i 's/v=51/v=52/g' index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/security.test.cjs')
          text = p.read_text(encoding='utf-8')
          old = "if (parsed.origin !== 'https://api.github.com') assert.equal(file, 'market-experience.js', `${parsed.origin} is only approved for market-experience.js`);"
          new = "if (parsed.origin !== 'https://api.github.com') assert.equal(['index.html','market-experience.js'].includes(file), true, `${parsed.origin} is only approved for index CSP and market runtime`);"
          if old not in text:
              raise SystemExit('Expected external-origin security assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify live source contracts
        run: |
          node scripts/probe-market-sources.cjs
          node scripts/probe-open-prices.cjs

      - name: Syntax checks
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check sync.js
          node --check market-experience.js
          node --check sw.js
          node --check scripts/prepare-pages.cjs

      - name: Full regression suite
        run: |
          node tests/finance.test.cjs
          node tests/audit.test.cjs
          node tests/counting-invariants.test.cjs
          node tests/isolation.test.cjs
          node tests/date-timezone.test.cjs
          node tests/form-regression.test.cjs
          node tests/market-categories.test.cjs
          node tests/market-experience.test.cjs
          node tests/market-live-accounting.test.cjs
          node tests/security.test.cjs
          node tests/responsive.test.cjs
          node tests/mobile-layout-regression.test.cjs
          node tests/navigation.test.cjs
          node tests/accessibility.test.cjs
          node tests/sync.test.cjs
          node tests/sync-runtime.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest OK')"

      - name: Commit validated v52 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mercado v52 — preços reais verificados e contabilização da lista"
          git push origin HEAD:feature/market-live-prices-v52
