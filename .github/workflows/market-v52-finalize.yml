name: Finalize Market v52

on:
  push:
    branches: [feature/market-live-prices-v52]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'finalize v52 files') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/market-live-prices-v52

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply audited v52 finalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # Public build + CSP: only the two audited market sources are added.
          index = read('index.html')
          old_csp = "connect-src 'self' https://api.github.com;"
          new_csp = "connect-src 'self' https://api.github.com https://cesta.pt https://prices.openfoodfacts.org;"
          if old_csp not in index:
              raise SystemExit('Expected v51 CSP not found in index.html')
          index = index.replace(old_csp, new_csp, 1).replace('v51', 'v52')
          write('index.html', index)

          events = read('events.js')
          old_sw = "register('./sw.js?v=50',{updateViaCache:'none'})"
          if old_sw not in events:
              raise SystemExit('Expected service worker registration not found')
          write('events.js', events.replace(old_sw, "register('./sw.js?v=52',{updateViaCache:'none'})", 1))

          sw = read('sw.js')
          if 'conta-de-casa-public-v51' not in sw:
              raise SystemExit('Expected v51 cache namespace not found')
          write('sw.js', sw.replace('conta-de-casa-public-v51', 'conta-de-casa-public-v52', 1))

          # Keep remote retailer URLs out of sanitized HTML. The trusted URL is resolved
          # from the already-validated result map only when the user explicitly clicks.
          js = read('market-experience.js')
          old_source = "const sourceLink=product.sourceUrl?`<a class=\"market-result-source\" href=\"${attr(product.sourceUrl)}\" target=\"_blank\" rel=\"noopener noreferrer\">${svgIcon('external',15)}<span>${esc(product.sourceLabel)}</span></a>`:`<span class=\"market-result-source text-only\">${esc(product.sourceLabel)}</span>`;"
          new_source = "const sourceLink=product.sourceUrl?`<button class=\"market-result-source\" type=\"button\" data-market-source-url=\"${attr(product.id)}\" aria-label=\"Abrir produto oficial\">${svgIcon('external',15)}<span>${esc(product.sourceLabel)}</span></button>`:`<span class=\"market-result-source text-only\">${esc(product.sourceLabel)}</span>`;"
          if old_source not in js:
              raise SystemExit('Expected source-link template not found')
          js = js.replace(old_source, new_source, 1)
          if '<h4>${esc(product.name)}</h4>' not in js:
              raise SystemExit('Expected product h4 not found')
          js = js.replace('<h4>${esc(product.name)}</h4>', '<h3>${esc(product.name)}</h3>', 1)
          click_marker = "    const add=event.target.closest('[data-market-add-product]');\n"
          if click_marker not in js:
              raise SystemExit('Expected add-product click marker not found')
          source_handler = "    const sourceButton=event.target.closest('[data-market-source-url]');\n    if(sourceButton){\n      const product=resultById.get(sourceButton.dataset.marketSourceUrl);\n      const url=product?.sourceUrl?safeRetailerUrl(product.sourceUrl,product.marketId):'';\n      if(url)window.open(url,'_blank','noopener,noreferrer');\n      return;\n    }\n"
          js = js.replace(click_marker, source_handler + click_marker, 1)
          write('market-experience.js', js)

          css = read('market-experience.css')
          if '.market-product-copy h4{' not in css:
              raise SystemExit('Expected product title selector not found')
          css = css.replace('.market-product-copy h4{', '.market-product-copy h3{', 1)
          focus_old = '.market-add-product:focus-visible,.market-source-card:focus-visible,.market-browser-chip:focus-visible,.market-browser-tab:focus-visible,.market-search-clear:focus-visible{'
          focus_new = '.market-add-product:focus-visible,.market-source-card:focus-visible,.market-browser-chip:focus-visible,.market-browser-tab:focus-visible,.market-search-clear:focus-visible,.market-result-source:focus-visible{'
          if focus_old not in css:
              raise SystemExit('Expected focus selector not found')
          css = css.replace(focus_old, focus_new, 1)
          # Button reset so the source control keeps link-like visual semantics.
          source_rule = '.market-result-source{display:inline-flex;align-items:center;gap:4px;min-height:30px;color:var(--primary);font-size:.75rem;font-weight:550;text-decoration:none}'
          source_rule_new = '.market-result-source{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0;border:0;background:transparent;color:var(--primary);font-size:.75rem;font-weight:550;text-decoration:none;text-align:left}'
          if source_rule not in css:
              raise SystemExit('Expected source-link CSS rule not found')
          css = css.replace(source_rule, source_rule_new, 1)
          write('market-experience.css', css)

          # Security page must describe the new, deliberately restricted network surface accurately.
          render = read('render.js')
          old_network = 'Sem CDNs, trackers, anúncios ou telemetria. Quando a sincronização está ativa, apenas api.github.com é autorizado e recebe somente o envelope cifrado.'
          new_network = 'Sem CDNs, trackers, anúncios ou telemetria. A sincronização usa apenas api.github.com e recebe somente o envelope cifrado. As pesquisas iniciadas pelo utilizador em Mercado podem consultar cesta.pt e prices.openfoodfacts.org; nenhum dado financeiro do cofre é enviado.'
          if old_network not in render:
              raise SystemExit('Expected security network text not found')
          write('render.js', render.replace(old_network, new_network, 1))

          # Security test: include the market runtime and enforce origin allowlisting per file.
          security = read('tests/security.test.cjs')
          old_files = "const appFiles = ['index.html','core.js','finance.js','render.js','forms.js','sync.js','events.js','styles.css','sw.js','manifest.webmanifest'];"
          new_files = "const appFiles = ['index.html','core.js','finance.js','render.js','forms.js','sync.js','events.js','market-experience.js','styles.css','sw.js','manifest.webmanifest'];"
          if old_files not in security:
              raise SystemExit('Expected security appFiles list not found')
          security = security.replace(old_files, new_files, 1)
          loop_marker = "for (const file of appFiles) {\n"
          if loop_marker not in security:
              raise SystemExit('Expected security external URL loop not found')
          security = security.replace(loop_marker, "const approvedExternalOrigins = new Set(['https://api.github.com','https://cesta.pt','https://prices.openfoodfacts.org']);\nfor (const file of appFiles) {\n", 1)
          old_approval = "    const approvedApi = parsed.origin === 'https://api.github.com';\n    assert.equal(approvedApi, true, `${file} may only reference the approved GitHub API`);"
          new_approval = "    assert.equal(approvedExternalOrigins.has(parsed.origin), true, `${file} references unapproved external origin ${parsed.origin}`);\n    if (parsed.origin !== 'https://api.github.com') assert.equal(file, 'market-experience.js', `${parsed.origin} is only approved for market-experience.js`);"
          if old_approval not in security:
              raise SystemExit('Expected security URL approval assertion not found')
          security = security.replace(old_approval, new_approval, 1)
          csp_marker = "assert.match(index, /connect-src 'self' https:\\/\\/api\\.github\\.com/);"
          if csp_marker not in security:
              raise SystemExit('Expected security CSP assertion not found')
          security = security.replace(csp_marker, csp_marker + "\nassert.match(index, /https:\\/\\/cesta\\.pt/);\nassert.match(index, /https:\\/\\/prices\\.openfoodfacts\\.org/);", 1)
          write('tests/security.test.cjs', security)

          market_test = read('tests/market-experience.test.cjs')
          old_rel = 'assert.match(js, /rel=\\"noopener noreferrer\\"/);'
          if old_rel not in market_test:
              raise SystemExit('Expected market source link assertion not found')
          market_test = market_test.replace(old_rel, "assert.match(js, /data-market-source-url=/);\nassert.match(js, /window\\.open\\(url,'_blank','noopener,noreferrer'\\)/);\nassert.match(js, /actualCents:0,purchased:false/);", 1)
          write('tests/market-experience.test.cjs', market_test)

          # Existing freshness/layout suites must follow the public v52 asset revision.
          responsive = read('tests/responsive.test.cjs').replace('v51', 'v52')
          write('tests/responsive.test.cjs', responsive)
          mobile = read('tests/mobile-layout-regression.test.cjs').replace('v51', 'v52')
          write('tests/mobile-layout-regression.test.cjs', mobile)

          # Dynamic accounting regression: sourced market price enters estimated totals immediately,
          # and becomes accounted spend when the item is marked purchased unless an actual price exists.
          accounting_test = r'''const assert = require('node:assert/strict');
const fs = require('node:fs');
const vm = require('node:vm');

const context = vm.createContext({
  sumCents(values){
    let total=0;
    for(const value of values){
      assert.equal(Number.isSafeInteger(value),true,'money values must remain safe integers');
      total+=value;
      assert.equal(Number.isSafeInteger(total),true,'money total must remain a safe integer');
    }
    return total;
  }
});
vm.runInContext(fs.readFileSync('render.js','utf8'), context);

const pending = vm.runInContext(`marketMetrics([{estimatedCents:510,actualCents:0,purchased:false}])`, context);
assert.equal(pending.estimatedTotal,510);
assert.equal(pending.pendingEstimated,510);
assert.equal(pending.accounted,0);

const purchasedFromSource = vm.runInContext(`marketMetrics([{estimatedCents:510,actualCents:0,purchased:true}])`, context);
assert.equal(purchasedFromSource.estimatedTotal,510);
assert.equal(purchasedFromSource.accounted,510);
assert.equal(purchasedFromSource.missingReal,1);
assert.equal(purchasedFromSource.variance,0);

const purchasedWithReceipt = vm.runInContext(`marketMetrics([{estimatedCents:510,actualCents:495,purchased:true}])`, context);
assert.equal(purchasedWithReceipt.accounted,495);
assert.equal(purchasedWithReceipt.missingReal,0);
assert.equal(purchasedWithReceipt.variance,-15);

const marketJs=fs.readFileSync('market-experience.js','utf8');
assert.match(marketJs,/estimatedCents:product\.priceCents,actualCents:0,purchased:false/);
assert.doesNotMatch(marketJs,/preços de demonstração|valores de demonstração|DEMO_PRODUCTS/i);

console.log('Live market price accounting invariants: OK');
'''
          write('tests/market-live-accounting.test.cjs', accounting_test)

          # CI: retain only providers used by production and add accounting regression.
          ci = read('.github/workflows/ci.yml')
          super_block = "\n      - name: Probe Super Save web\n        run: node scripts/probe-supersave.cjs\n"
          if super_block not in ci:
              raise SystemExit('Expected temporary Super Save CI block not found')
          ci = ci.replace(super_block, '', 1)
          ci = ci.replace('      - name: Market prototype tests\n        run: node tests/market-experience.test.cjs\n', '      - name: Market live-source tests\n        run: node tests/market-experience.test.cjs\n\n      - name: Market live-price accounting tests\n        run: node tests/market-live-accounting.test.cjs\n', 1)
          write('.github/workflows/ci.yml', ci)

          pages = read('.github/workflows/pages.yml')
          if 'node --check market-experience.js' not in pages:
              pages = pages.replace('          node --check sync.js\n', '          node --check sync.js\n          node --check market-experience.js\n', 1)
          if 'node tests/market-experience.test.cjs' not in pages:
              pages = pages.replace('          node tests/market-categories.test.cjs\n', '          node tests/market-categories.test.cjs\n          node tests/market-experience.test.cjs\n          node tests/market-live-accounting.test.cjs\n', 1)
          write('.github/workflows/pages.yml', pages)

          # Temporary discovery probe is not part of the production source contract.
          Path('scripts/probe-supersave.cjs').unlink(missing_ok=True)

          decisions = read('docs/DECISIONS.md')
          if '## D-006 — Preços reais pesquisados entram como estimativa auditável' not in decisions:
              decisions += '''\n\n## D-006 — Preços reais pesquisados entram como estimativa auditável\n\nData: 5 de setembro de 2026\nEstado: aceite\n\n### Contexto\n\nO utilizador pediu que a Lista de compras use preços reais pesquisados e que o valor selecionado seja contabilizado na lista, sem manter dados fictícios. A aplicação continua estática/local-first e não deve tratar uma consulta de preço como prova do montante efetivamente pago.\n\n### Decisão\n\nContinente e Pingo Doce são pesquisados através do endpoint público `cesta.pt/mcp`. Mercadona Portugal usa apenas observações do Open Prices localizadas em Portugal e com comprovativo. O preço escolhido é guardado em `estimatedCents`; `actualCents` permanece reservado ao valor efetivamente pago. Ao marcar o item como comprado, o cálculo contabilizado usa `actualCents` quando existe e, caso contrário, usa a estimativa pesquisada.\n\nA CSP autoriza exclusivamente `cesta.pt` e `prices.openfoodfacts.org` para este fluxo, além da API GitHub já existente. A aplicação não envia dados financeiros do cofre a estas fontes.\n\n### Motivo\n\nEsta separação permite que o total da lista reflita imediatamente o preço real consultado sem afirmar que esse foi necessariamente o preço de compra. Também mantém rastreabilidade, evita preços inventados e preserva a lógica financeira existente.\n\n### Limitação\n\nA disponibilidade, cobertura e atualidade dependem das fontes externas. Em particular, Mercadona é uma observação comunitária com data, não uma API oficial em tempo real. Quando não existe evidência adequada, a aplicação deve mostrar ausência de preço em vez de fabricar um valor.\n'''
              write('docs/DECISIONS.md', decisions)

          changelog = read('docs/CHANGELOG.md')
          heading = '# Changelog Técnico — Conta de Casa\n'
          section = '''\n## 2026-09-05 — Mercado v52 com preços reais e contabilização da lista\n\n### Alterações\n\n- removidos preços e imagens de demonstração do fluxo **Adicionar produto**;\n- pesquisa real de Continente e Pingo Doce através de `cesta.pt/mcp`;\n- Mercadona Portugal limitada a observações Open Prices em lojas portuguesas com comprovativo e data;\n- o preço selecionado é guardado em `estimatedCents` e atualiza imediatamente **Estimado total** e **Por comprar**;\n- quando o item é marcado como comprado, **Gasto contabilizado** usa o preço real registado pelo utilizador ou, enquanto esse valor não existir, a estimativa pesquisada;\n- `actualCents` continua separado para não confundir preço consultado com preço efetivamente pago;\n- CSP alargada apenas a `cesta.pt` e `prices.openfoodfacts.org`;\n- ligação para produto oficial é aberta apenas após validação do host e clique explícito do utilizador;\n- Service Worker, cache busting e build pública atualizados para v52;\n- acrescentado teste dinâmico de contabilização de preços e reforçadas as verificações de segurança/origens externas;\n- removido o probe temporário do Super Save, que não faz parte do contrato de produção.\n\n### Segurança e privacidade\n\nSem credenciais de supermercado, API keys ou tokens de terceiros. O conteúdo remoto é tratado como não confiável e escapado antes de apresentação. A pesquisa envia apenas o termo pesquisado às fontes selecionadas; o cofre financeiro permanece local/cifrado.\n\n'''
          if '## 2026-09-05 — Mercado v52 com preços reais e contabilização da lista' not in changelog:
              if not changelog.startswith(heading):
                  raise SystemExit('Unexpected CHANGELOG heading')
              changelog = heading + section + changelog[len(heading):]
              write('docs/CHANGELOG.md', changelog)
          PY

      - name: Verify live source contracts
        run: |
          node scripts/probe-market-sources.cjs
          node scripts/probe-open-prices.cjs

      - name: Syntax checks
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check sync.js
          node --check market-experience.js
          node --check sw.js
          node --check scripts/prepare-pages.cjs

      - name: Full regression suite
        run: |
          node tests/finance.test.cjs
          node tests/audit.test.cjs
          node tests/counting-invariants.test.cjs
          node tests/isolation.test.cjs
          node tests/date-timezone.test.cjs
          node tests/form-regression.test.cjs
          node tests/market-categories.test.cjs
          node tests/market-experience.test.cjs
          node tests/market-live-accounting.test.cjs
          node tests/security.test.cjs
          node tests/responsive.test.cjs
          node tests/mobile-layout-regression.test.cjs
          node tests/navigation.test.cjs
          node tests/accessibility.test.cjs
          node tests/sync.test.cjs
          node tests/sync-runtime.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest OK')"

      - name: Commit validated v52 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Mercado v52 — preços reais verificados e contabilização da lista"
          git push origin HEAD:feature/market-live-prices-v52
