name: TypeScript Foundation

on:
  push:
    branches:
      - main
      - 'feat/v76-typescript-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install TypeScript toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Confirm no runtime switch in foundation block
        run: |
          test ! -e dist
          grep -q "'core.js'" scripts/prepare-pages.cjs
          grep -q "'finance.js'" scripts/prepare-pages.cjs
          grep -q "'events.js'" scripts/prepare-pages.cjs
