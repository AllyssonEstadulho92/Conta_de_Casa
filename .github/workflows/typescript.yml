name: TypeScript Foundation

on:
  push:
    branches:
      - main
      - 'feat/v76-typescript-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install TypeScript toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Generate TypeScript runtime artifacts
        run: npm run build:runtime

      - name: Validate generated runtimes
        run: |
          node --check .generated/v76-veggie-menu.js
          node --check .generated/market-branding.js
          node tests/typescript-runtime-build.test.cjs

      - name: Confirm migration remains isolated
        run: |
          grep -q "'core.js'" scripts/prepare-pages.cjs
          grep -q "'finance.js'" scripts/prepare-pages.cjs
          grep -q "'events.js'" scripts/prepare-pages.cjs
          test -f src/ui/veggie-menu-toggle.ts
          test -f src/ui/market-branding.ts
          test -f .generated/v76-veggie-menu.js
          test -f .generated/market-branding.js
          test ! -f v76-veggie-menu.js
          test ! -f market-branding.js
