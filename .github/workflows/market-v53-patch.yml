name: Apply Market v53

on:
  push:
    branches:
      - feature/market-quantity-v53
    paths:
      - .github/workflows/market-v53-patch.yml
      - scripts/patch-market-v53.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/market-quantity-v53

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fix patch replacement handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-market-v53.py')
          text=p.read_text(encoding='utf-8')
          old="updated, count = re.subn(pattern, repl, text, count=1, flags=flags)"
          new="updated, count = re.subn(pattern, lambda _m: repl, text, count=1, flags=flags)"
          if old not in text:
              raise SystemExit('regex_once implementation not found')
          text=text.replace(old,new,1)
          bad='text=text.replace("(item.estimatedCents||0))","marketItemEstimatedCents(item)))")'
          good='text=text.replace("money(item.purchased?effective:(item.estimatedCents||0))","money(item.purchased?effective:marketItemEstimatedCents(item))")'
          if bad not in text:
              raise SystemExit('quantity render replacement not found')
          text=text.replace(bad,good,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Apply v53 patch
        run: python3 scripts/patch-market-v53.py

      - name: Align v53 public files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          index.write_text(index.read_text(encoding='utf-8').replace('v=52','v=53'),encoding='utf-8')

          market=Path('market-experience.js')
          market_text=market.read_text(encoding='utf-8')
          market_text=market_text.replace(' * Mercadona Portugal: observações públicas com comprovativo através de Open Prices.\n',' * Mercados ativos: Pingo Doce e Continente.\n')
          market.write_text(market_text,encoding='utf-8')

          css=Path('market-experience.css')
          css_text=css.read_text(encoding='utf-8').replace('font-size:.65rem','font-size:.75rem').replace('font-size:.72rem','font-size:.75rem')
          css.write_text(css_text,encoding='utf-8')

          for name in ['tests/market-experience.test.cjs','tests/responsive.test.cjs','tests/mobile-layout-regression.test.cjs']:
              p=Path(name)
              text=p.read_text(encoding='utf-8').replace('v=52','v=53').replace('public-v52','public-v53')
              p.write_text(text,encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check market-experience.js
          node --check sw.js

      - name: Focused market tests
        run: |
          node tests/market-experience.test.cjs
          node tests/market-live-accounting.test.cjs
          node tests/security.test.cjs
          node tests/responsive.test.cjs
          node tests/mobile-layout-regression.test.cjs

      - name: Full regression suite
        run: |
          node tests/finance.test.cjs
          node tests/audit.test.cjs
          node tests/counting-invariants.test.cjs
          node tests/isolation.test.cjs
          node tests/date-timezone.test.cjs
          node tests/form-regression.test.cjs
          node tests/market-categories.test.cjs
          node tests/navigation.test.cjs
          node tests/accessibility.test.cjs
          node tests/sync.test.cjs
          node tests/sync-runtime.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('Manifest OK')"

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js finance.js render.js forms.js events.js market-experience.js market-experience.css index.html sw.js tests docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mercado v53 — quantidade automática e Pingo Doce/Continente"
            git push origin HEAD:feature/market-quantity-v53
          fi
