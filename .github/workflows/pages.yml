name: Deploy Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify tested revision
        run: |
          node --check core.js
          node --check finance.js
          node --check render.js
          node --check forms.js
          node --check events.js
          node --check sync.js
          node --check sync-conflict-policy.js
          node --check market-experience.js
          node --check market-branding.js
          node --check market-category-groups.js
          node --check market-barcode.js
          node --check ui-icons.js
          node --check invoice-capture.js
          node --check app-update.js
          node --check market-retailer-image-policy.js
          node --check market-image-audit.js
          node --check market-official-images.js
          node --check sw.js
          node --check scripts/prepare-pages.cjs
          node tests/finance.test.cjs
          node tests/audit.test.cjs
          node tests/counting-invariants.test.cjs
          node tests/isolation.test.cjs
          node tests/date-timezone.test.cjs
          node tests/form-regression.test.cjs
          node tests/invoice-capture.test.cjs
          node tests/market-categories.test.cjs
          node tests/market-category-groups.test.cjs
          node tests/market-experience.test.cjs
          node tests/market-product-images.test.cjs
          node tests/market-image-audit.test.cjs
          node tests/market-official-images.test.cjs
          node tests/market-barcode.test.cjs
          node tests/market-live-accounting.test.cjs
          node tests/ui-icons.test.cjs
          node tests/app-update.test.cjs
          node tests/security.test.cjs
          node tests/responsive.test.cjs
          node tests/mobile-layout-regression.test.cjs
          node tests/navigation.test.cjs
          node tests/accessibility.test.cjs
          node tests/sync.test.cjs
          node tests/sync-conflict-policy.test.cjs
          node tests/sync-runtime.test.cjs
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('Manifest OK')"

      - name: Prepare public site allowlist
        run: node scripts/prepare-pages.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
