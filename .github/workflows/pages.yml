name: Deploy Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact CI-approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Confirm revision identity
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
          test "$ACTUAL_SHA" = "$TESTED_SHA"
          echo "Deploying CI-approved revision $ACTUAL_SHA"

      - name: Install validation toolchain
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Revalidate TypeScript and release contract
        run: |
          npm run typecheck
          npm run check:release

      - name: Prepare public site allowlist
        run: node scripts/prepare-pages.cjs

      - name: Verify prepared v76 metadata
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('dist/index.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('dist/release-manifest.json','utf8'));
          const meta=name=>new RegExp(`<meta name="${name}" content="([^"]+)"`).exec(html)?.[1]||'';
          if(meta('app-version')!=='0.76.0') throw new Error(`Unexpected app version: ${meta('app-version')}`);
          if(meta('app-build')!=='v76') throw new Error(`Unexpected release: ${meta('app-build')}`);
          if(!/^[0-9a-f]{7}$/.test(meta('app-build-id'))) throw new Error(`Invalid build id: ${meta('app-build-id')}`);
          if(manifest.latestVersion!=='v76') throw new Error(`Unexpected manifest release: ${manifest.latestVersion}`);
          console.log(`Validated Conta de Casa ${meta('app-version')} / ${meta('app-build')} / build ${meta('app-build-id')}`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
