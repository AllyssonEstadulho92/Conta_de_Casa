<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Conta de Casa">
  <defs>
    <linearGradient id="tile" x1="74" y1="58" x2="438" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F2F1"/>
    </linearGradient>
    <linearGradient id="house" x1="188" y1="190" x2="328" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00645F"/>
      <stop offset="1" stop-color="#07978B"/>
    </linearGradient>
    <linearGradient id="roof" x1="138" y1="154" x2="374" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66E5C5"/>
      <stop offset="1" stop-color="#11B89F"/>
    </linearGradient>
    <radialGradient id="coin" cx="0" cy="0" r="1" gradientTransform="translate(232 284) rotate(47) scale(111)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".72" stop-color="#F2FBF9"/>
      <stop offset="1" stop-color="#DCEFEB"/>
    </radialGradient>
    <filter id="tileShadow" x="12" y="12" width="488" height="488" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17494B" flood-opacity=".16"/>
      <feDropShadow dx="-8" dy="-8" stdDeviation="16" flood-color="#FFFFFF" flood-opacity=".78"/>
    </filter>
    <filter id="markShadow" x="90" y="94" width="332" height="352" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#004F4C" flood-opacity=".22"/>
    </filter>
    <filter id="coinShadow" x="148" y="202" width="216" height="216" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#075F5B" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#F4F8F8"/>
  <rect x="44" y="44" width="424" height="424" rx="108" fill="url(#tile)" filter="url(#tileShadow)"/>

  <g filter="url(#markShadow)">
    <rect x="330" y="140" width="44" height="92" rx="16" fill="#07847C"/>
    <path d="M161 246 256 168l95 78v126c0 23-19 42-42 42H203c-23 0-42-19-42-42Z" fill="url(#house)"/>
    <path d="M132 248 256 145l124 103" fill="none" stroke="url(#roof)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#coinShadow)">
    <circle cx="256" cy="310" r="80" fill="url(#coin)"/>
    <circle cx="256" cy="310" r="79" fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="3"/>
    <text x="256" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" fill="#07857B">$</text>
  </g>
